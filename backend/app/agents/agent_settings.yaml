timing:
  silence_trigger_enabled: true
  silence_threshold_seconds: 120
  analysis_interval_minutes: 5
  warmup_minutes: 3
  agent_cooldown_seconds: 5
  room_auto_intervention_cooldown_seconds: 180
  rule_trigger_marker_ttl_seconds: 180
  agent_response_timeout_seconds: 90
  agent_global_concurrency_limit: 3
  mention_entry_enabled: true
  mention_entry_rate_per_sec: 3
  mention_entry_queue_max_wait_sec: 60
  time_progress_jitter_enabled: true
  time_progress_jitter_min_seconds: 30
  time_progress_jitter_max_seconds: 90
  emotional_support_enabled: true
  emotional_support_check_interval_seconds: 30
  emotional_support_keywords:
    - 不会
    - 不知道
    - 太难
    - 好难
    - 算了
    - 烦
    - 好烦
    - 没人说
    - 随便
    - 不想
    - 没意思
    - 做不下去
    - 卡住
    - 放弃
  emotional_support_recent_window_seconds: 120
  emotional_support_cooldown_seconds: 180

thresholds:
  monopoly_message_count: 5

models:
  role_agents:
    model_version: ""

mention:
  enabled: true
  priority: 0
  max_mentions_per_message: 1

auto_speak:
  facilitator_silence_enabled: true
  time_progress_enabled: true
  committee_enabled: false
  committee_recent_same_role_window: 2
  monopoly_encourager_enabled: true
  committee_devil_advocate_enabled: true
  committee_summarizer_enabled: true
  committee_encourager_enabled: true

bailian_search_app:
  enabled: false
  app_id_env: BAILIAN_SEARCH_APP_ID
  timeout_seconds: 120
